<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlueMedical v2</title>
<style>
  :root { --bg:#f5f7fb; --card:#fff; --text:#1f2937; --muted:#6b7280; --line:#e5e7eb; --brand:#2563eb; --user:#e0ecff; --warn:#b45309; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
  header { padding:14px 20px; background:var(--card); border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  header h1 { margin:0; font-size:18px; } header small { color:var(--muted); }
  main { display:grid; grid-template-columns: 1.3fr 1fr; gap:16px; padding:16px; height:calc(100vh - 58px); }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; display:flex; flex-direction:column; min-height:0; }
  .panel h2 { margin:0; padding:12px 16px; font-size:14px; border-bottom:1px solid var(--line); color:var(--muted); }
  #chat, #trace { flex:1; overflow:auto; padding:16px; }
  .msg { margin-bottom:14px; max-width:92%; padding:10px 14px; border-radius:12px; white-space:pre-wrap; line-height:1.6; font-size:14px; }
  .user { background:var(--user); margin-left:auto; }
  .bot { background:#f9fafb; border:1px solid var(--line); }
  .bot .safety { color:var(--warn); margin-top:8px; font-size:13px; }
  .bot details { margin-top:8px; font-size:12px; color:var(--muted); } .bot img, .user img { max-width:220px; border-radius:8px; display:block; margin-top:6px; }
  .step { border-left:3px solid var(--brand); padding:6px 10px; margin-bottom:10px; font-size:13px; white-space:pre-wrap; background:#f9fafb; border-radius:0 8px 8px 0; }
  .step b { display:block; color:var(--brand); margin-bottom:2px; } .turn { color:var(--muted); font-size:12px; margin:14px 0 8px; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); align-items:center; }
  input[type=text] { flex:1; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-size:14px; }
  button, label.btn { padding:9px 14px; border:0; border-radius:8px; background:var(--brand); color:#fff; cursor:pointer; font-size:14px; }
  label.btn { background:#64748b; } button:disabled { opacity:.5; cursor:default; }
  #preview { font-size:12px; color:var(--muted); }
  @media (max-width: 800px) { main { grid-template-columns:1fr; height:auto; } #chat, #trace { max-height:60vh; } }
</style>
</head>
<body>
<header><h1 data-i18n="title"></h1>
  <div><small id="profile"></small>
    <button id="lang" style="margin-left:8px;background:#64748b"></button>
    <button id="newchat" style="margin-left:4px;background:#64748b" data-i18n="newchat"></button></div></header>
<main>
  <section class="panel"><h2 data-i18n="chat"></h2><div id="chat"></div>
    <form id="form">
      <label class="btn"><span data-i18n="image"></span><input id="file" type="file" accept="image/*" hidden></label>
      <span id="preview"></span>
      <input id="q" type="text" autocomplete="off">
      <button id="send" data-i18n="send"></button>
    </form>
  </section>
  <section class="panel"><h2 data-i18n="trace"></h2><div id="trace"></div></section>
</main>
<script>
const $ = s => document.querySelector(s);
let threadId = localStorage.getItem("thread") || crypto.randomUUID(); localStorage.setItem("thread", threadId);
let imageId = null, imageUrl = null, turn = 0, profile = {};

// 界面语言（只影响界面文字和轨迹说明；回答语言跟随用户提问的语言，由后端判断）
const I18N = {
  en: {title: "BlueMedical v2 · Multi-Agent Medical QA", chat: "Chat", trace: "Agent Trace (live)", image: "Image", send: "Send",
       newchat: "New chat", switch: "中文", placeholder: "e.g. My father has gout. What foods should he avoid?",
       profile: "User profile: ", none: "(empty)", allergy: a => "allergic to " + a, thinking: "Thinking…",
       turn: n => `—— Turn ${n}: `, attached: "Attached ", evidence: n => `Cited evidence (${n})`, seg: "FastSAM segmentation", error: "Error: "},
  zh: {title: "BlueMedical v2 · 多 Agent 医疗问答", chat: "对话", trace: "Agent 轨迹（实时）", image: "图片", send: "发送",
       newchat: "新会话", switch: "EN", placeholder: "例如：我爸有痛风，平时饮食上有什么忌口？",
       profile: "用户档案：", none: "（暂无）", allergy: a => a + "过敏", thinking: "思考中…",
       turn: n => `—— 第 ${n} 轮：`, attached: "已附加 ", evidence: n => `引用证据（${n}）`, seg: "FastSAM 分割结果", error: "出错了："},
};
let lang = "en"; try { lang = localStorage.getItem("lang") || "en"; } catch (e) {}
const T = () => I18N[lang];
function applyLang() {
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = T()[el.dataset.i18n]);
  $("#lang").textContent = T().switch; $("#q").placeholder = T().placeholder; document.title = T().title;
  document.documentElement.lang = lang; showProfile(profile);
}
$("#lang").onclick = () => { lang = lang === "en" ? "zh" : "en"; try { localStorage.setItem("lang", lang); } catch (e) {} applyLang(); };

$("#newchat").onclick = () => { threadId = crypto.randomUUID(); localStorage.setItem("thread", threadId);
  $("#chat").innerHTML = ""; $("#trace").innerHTML = ""; turn = 0; };

$("#file").onchange = async e => {
  const fd = new FormData(); fd.append("image", e.target.files[0]);
  const r = await (await fetch("/upload_image", {method: "POST", body: fd})).json();
  if (r.error) { alert(r.error); return; }
  imageId = r.image_id; imageUrl = r.url; $("#preview").textContent = T().attached + imageId;
};

function add(cls, html) { const d = document.createElement("div"); d.className = "msg " + cls; d.innerHTML = html;
  $("#chat").appendChild(d); $("#chat").scrollTop = 1e9; return d; }
const esc = s => (s || "").replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));
function showProfile(p2) { profile = p2 = p2 || {};
  $("#profile").textContent = T().profile + ([p2.subject, ...(p2.conditions || []), ...(p2.allergies || []).map(T().allergy)].filter(Boolean).join(", ") || T().none); }
applyLang();

// 打开页面时从服务端读回本会话的历史（记忆存在 SQLite 里，刷新页面或重启服务都还在）
fetch("/history?thread_id=" + threadId).then(r => r.json()).then(h => {
  for (const t of h.conversation) { add("user", esc(t.user)); add("bot", esc(t.assistant)); }
  turn = h.conversation.length; showProfile(h.profile);
});

$("#form").onsubmit = async e => {
  e.preventDefault(); const q = $("#q").value.trim(); if (!q) return;
  $("#send").disabled = true; $("#q").value = "";
  add("user", esc(q) + (imageUrl ? `<img src="${imageUrl}">` : ""));
  const pending = add("bot", T().thinking);
  $("#trace").insertAdjacentHTML("beforeend", `<div class="turn">${T().turn(++turn)}${esc(q)}</div>`);
  const resp = await fetch("/ask", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({question: q, image_id: imageId, thread_id: threadId, lang})});
  imageId = imageUrl = null; $("#preview").textContent = "";
  const reader = resp.body.getReader(), dec = new TextDecoder(); let buf = "";
  while (true) {
    const {value, done} = await reader.read(); if (done) break;
    buf += dec.decode(value, {stream: true});
    const parts = buf.split("\n\n"); buf = parts.pop();
    for (const p of parts) {
      if (!p.startsWith("data: ")) continue;
      const ev = JSON.parse(p.slice(6));
      if (ev.type === "step") {
        $("#trace").insertAdjacentHTML("beforeend", `<div class="step"><b>${ev.node}</b>${esc(ev.text)}</div>`);
        $("#trace").scrollTop = 1e9;
      } else if (ev.type === "answer") {
        pending.innerHTML = esc(ev.answer)
          + (ev.segmented ? `<img src="${ev.segmented}" title="${T().seg}">` : "")
          + (ev.safety ? `<div class="safety">⚠️ ${esc(ev.safety)}</div>` : "")
          + (ev.evidence.length ? `<details><summary>${T().evidence(ev.evidence.length)}</summary>${ev.evidence.map(esc).join("<br>")}</details>` : "");
        showProfile(ev.profile);
      } else if (ev.type === "error") { pending.textContent = T().error + ev.text; }
    }
  }
  $("#send").disabled = false; $("#q").focus();
};
</script>
</body>
</html>
